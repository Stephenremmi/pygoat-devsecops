name: Quality Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Flake8 Python Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flake8>=7,<8"

      - name: Check for critical Python errors
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Report broader quality findings
        run: |
          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

  dockerfile-quality:
    name: Hadolint Dockerfile Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan root Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: ./Dockerfile